version: "3.9"

services:
  db:
    image: postgres:15
    container_name: local_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: fastapi_service
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://admin:admin123@db:5432/mydb
    ports:
      - "8080:8080"

volumes:
  pgdata:
